<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboForex Analysis — Хронологія проєкту</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16202e;
    --muted: #5d6b7d;
    --border: #dde3ea;
    --shadow: 0 1px 3px rgba(16,32,54,.06), 0 8px 24px rgba(16,32,54,.05);

    --claude:   #7c5cff;
    --gpt:      #12a150;
    --deepseek: #0b8bd0;
    --user:     #c77700;
    --error:    #d92d20;
    --ok:       #12a150;

    --claude-bg:   rgba(124,92,255,.09);
    --gpt-bg:      rgba(18,161,80,.09);
    --deepseek-bg: rgba(11,139,208,.09);
    --user-bg:     rgba(199,119,0,.10);
    --error-bg:    rgba(217,45,32,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --card: #161d26; --text: #e6ecf3; --muted: #9aa8ba;
      --border: #27313d; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      --claude: #a58bff; --gpt: #3ecf7e; --deepseek: #4cb3f5; --user: #f0a72a;
      --error: #ff6b5e; --ok: #3ecf7e;
      --claude-bg: rgba(165,139,255,.12); --gpt-bg: rgba(62,207,126,.12);
      --deepseek-bg: rgba(76,179,245,.12); --user-bg: rgba(240,167,42,.12);
      --error-bg: rgba(255,107,94,.12);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --card: #161d26; --text: #e6ecf3; --muted: #9aa8ba;
    --border: #27313d; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --claude: #a58bff; --gpt: #3ecf7e; --deepseek: #4cb3f5; --user: #f0a72a;
    --error: #ff6b5e; --ok: #3ecf7e;
    --claude-bg: rgba(165,139,255,.12); --gpt-bg: rgba(62,207,126,.12);
    --deepseek-bg: rgba(76,179,245,.12); --user-bg: rgba(240,167,42,.12);
    --error-bg: rgba(255,107,94,.12);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.62; font-size: 16px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 90px; }

  /* ---------- перемикач мови ---------- */
  .langbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: flex-end; gap: 6px;
    padding: 12px 0 10px; margin-bottom: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .langbtn {
    font: inherit; font-size: 13px; font-weight: 650; letter-spacing: .04em;
    padding: 6px 15px; border-radius: 8px; cursor: pointer;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border);
    transition: color .12s, border-color .12s, background .12s;
  }
  .langbtn:hover { color: var(--text); }
  .langbtn[aria-pressed="true"] {
    background: var(--claude-bg); color: var(--claude);
    border-color: var(--claude);
  }
  .langbtn:focus-visible { outline: 2px solid var(--claude); outline-offset: 2px; }

  /* ---------- шапка ---------- */
  header { padding: 44px 0 30px; border-bottom: 1px solid var(--border); margin-bottom: 34px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin-bottom: 12px;
  }
  h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; letter-spacing: -.02em; }
  .lede { margin: 0; color: var(--muted); font-size: 17px; max-width: 68ch; }

  .meta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
  }
  .pill b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- панель стану ---------- */
  .status {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px 26px; box-shadow: var(--shadow); margin-bottom: 34px;
  }
  .status h2 { margin: 0 0 16px; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; }
  .stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
  .stat .v { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .stat .v small { font-size: 13px; font-weight: 400; color: var(--muted); display: block; margin-top: 3px; letter-spacing: 0; }

  /* ---------- легенда ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    border: 1px solid transparent;
  }
  .chip.claude   { background: var(--claude-bg);   color: var(--claude);   border-color: var(--claude); }
  .chip.gpt      { background: var(--gpt-bg);      color: var(--gpt);      border-color: var(--gpt); }
  .chip.deepseek { background: var(--deepseek-bg); color: var(--deepseek); border-color: var(--deepseek); }
  .chip.user     { background: var(--user-bg);     color: var(--user);     border-color: var(--user); }
  .chip.error    { background: var(--error-bg);    color: var(--error);    border-color: var(--error); }

  /* ---------- хронологія ---------- */
  .round-head {
    text-align: center;
    margin: 70px 0 32px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }
  .round-head.first { margin-top: 6px; padding-top: 0; border-top: none; }
  .round-num {
    font-size: clamp(46px, 9vw, 68px);
    font-weight: 750;
    line-height: 1;
    letter-spacing: -.04em;
    margin-bottom: 6px;
  }
  .round-n {
    font-size: clamp(16px, 2.5vw, 20px);
    font-weight: 650;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.3;
  }
  .round-n .slash { font-weight: 400; margin: 0 .3em; opacity: .6; }
  .round-sub {
    font-size: clamp(19px, 3vw, 24px);
    font-weight: 650;
    letter-spacing: -.015em;
    margin-top: 12px;
  }
  .round-sub.solo {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 750;
    letter-spacing: -.025em;
    color: var(--text);
    margin-top: 0;
  }

  .entry {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--muted);
    border-radius: 12px; padding: 22px 26px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .entry.claude   { border-left-color: var(--claude); }
  .entry.gpt      { border-left-color: var(--gpt); }
  .entry.deepseek { border-left-color: var(--deepseek); }
  .entry.user     { border-left-color: var(--user); }
  .entry.error    { border-left-color: var(--error); background: var(--error-bg); }

  .entry-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .author { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .entry.claude   .author { color: var(--claude); }
  .entry.gpt      .author { color: var(--gpt); }
  .entry.deepseek .author { color: var(--deepseek); }
  .entry.user     .author { color: var(--user); }
  .entry.error    .author { color: var(--error); }
  .when { font-size: 12.5px; color: var(--muted); }

  .entry h3 { margin: 0 0 12px; font-size: 20px; line-height: 1.3; letter-spacing: -.01em; }
  .entry h4 { margin: 22px 0 9px; font-size: 15px; letter-spacing: -.005em; }
  .entry p { margin: 0 0 12px; }
  .entry ul { margin: 0 0 12px; padding-left: 20px; }
  .entry li { margin-bottom: 7px; }
  .entry li::marker { color: var(--muted); }
  .entry > :last-child { margin-bottom: 0; }

  code {
    background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 1px 5px; font-size: .88em;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  .quote {
    border-left: 3px solid var(--border); padding: 3px 0 3px 16px;
    color: var(--muted); font-style: italic; margin: 0 0 14px;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .tag {
    font-size: 11.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted);
  }
  .tag.ok    { color: var(--ok);    border-color: var(--ok);    background: var(--gpt-bg); }
  .tag.bad   { color: var(--error); border-color: var(--error); background: var(--error-bg); }
  .tag.open  { color: var(--user);  border-color: var(--user);  background: var(--user-bg); }

  /* ---------- таблиці ---------- */
  .scroll { overflow-x: auto; margin: 0 0 14px; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 460px; }
  th, td { text-align: left; padding: 9px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
  tbody tr:last-child td { border-bottom: none; }
  td.no  { color: var(--error); font-weight: 600; }
  td.yes { color: var(--ok); font-weight: 600; }

  /* ---------- блоки ---------- */
  .box {
    border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin: 0 0 14px;
    background: var(--bg);
  }
  .box.danger { border-color: var(--error); background: var(--error-bg); }
  .box .box-title {
    font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    margin-bottom: 8px; color: var(--muted);
  }
  .box.danger .box-title { color: var(--error); }
  .box p:last-child, .box ul:last-child { margin-bottom: 0; }

  footer {
    margin-top: 60px; padding-top: 26px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 13.5px;
  }
  footer p { margin: 0 0 8px; }

  noscript .box { margin-top: 30px; }

  @media (max-width: 600px) {
    .entry { padding: 18px 18px; }
    .status { padding: 20px 18px; }
    body { font-size: 15.5px; }
    .langbar { justify-content: center; }
  }
</style>
</head>

/* ===================== рендеринг ===================== */

function render(lang) {
  const d = DATA[lang];
  if (!d) return;

  document.documentElement.lang = lang;
  document.title = d.docTitle;

  let h = "";

  h += '<header>';
  h += '<div class="eyebrow">' + d.eyebrow + '</div>';
  h += '<h1>' + d.h1 + '</h1>';
  h += '<p class="lede">' + d.lede + '</p>';
  h += '<div class="meta-row">';
  d.pills.forEach(function (p) {
    h += '<span class="pill"><span class="dot" style="background:' + p.c + '"></span> '
       + p.l + ' <b>' + p.v + '</b></span>';
  });
  h += '</div></header>';

  h += '<section class="status"><h2>' + d.statusTitle + '</h2><div class="grid">';
  d.stats.forEach(function (s) {
    h += '<div class="stat"><div class="k">' + s.k + '</div>'
       + '<div class="v">' + s.v + '<small>' + s.s + '</small></div></div>';
  });
  h += '</div></section>';

  h += '<div class="legend">';
  d.legend.forEach(function (l) { h += '<span class="chip ' + l.c + '">' + l.t + '</span>'; });
  h += '</div>';

  d.rounds.forEach(function (r, i) {
    h += '<div class="round-head' + (i === 0 ? ' first' : '') + '">';
    if (r.n) {
      h += '<div class="round-num">' + r.n + '</div>';
      h += '<div class="round-n">' + d.roundLabel + '</div>';
      h += '<div class="round-sub">' + r.title + '</div>';
    } else {
      h += '<div class="round-sub solo">' + r.title + '</div>';
    }
    h += '</div>';
    r.entries.forEach(function (e) {
      h += '<article class="entry ' + e.c + '">';
      h += '<div class="entry-head"><span class="author">' + e.a + '</span>'
         + (e.w ? '<span class="when">' + e.w + '</span>' : '') + '</div>';
      h += '<h3>' + e.h + '</h3>';
      h += e.b;
      if (e.tags && e.tags.length) {
        h += '<div class="tags">';
        e.tags.forEach(function (t) { h += '<span class="tag ' + t.c + '">' + t.t + '</span>'; });
        h += '</div>';
      }
      h += '</article>';
    });
  });

  h += '<footer>';
  d.footer.forEach(function (p, i) {
    h += '<p' + (i === d.footer.length - 1 ? ' style="margin-top:16px"' : '') + '>' + p + '</p>';
  });
  h += '</footer>';

  document.getElementById("app").innerHTML = h;

  document.querySelectorAll(".langbtn").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
}

function setLang(lang) {
  render(lang);
  try { localStorage.setItem("rfa_lang", lang); } catch (e) { /* приватний режим */ }
}

/* Мова за замовчуванням — українська. Збережений вибір має пріоритет. */
(function init() {
  var lang = "uk";
  try {
    var saved = localStorage.getItem("rfa_lang");
    if (saved && DATA[saved]) lang = saved;
  } catch (e) { /* сховище недоступне */ }

  render(lang);

  document.querySelectorAll(".langbtn").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.dataset.lang); });
  });
})();
</script>
